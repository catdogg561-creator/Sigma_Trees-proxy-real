<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma_Trees Proxy</title>
    <style>
        body {
            background-color: #0b0f12; /* Deep dark background */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.3s ease;
        }

        /* Styling explicitly for when the screen goes into full browser mode */
        body:fullscreen {
            background-color: #0b0f12;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            color: #2ecc71; /* Vibrant Sigma Green */
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
        }

        p {
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        .search-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border-radius: 30px;
            overflow: hidden;
            border: 2px solid #2ecc71;
        }

        .search-input {
            flex: 1;
            padding: 15px 25px;
            border: none;
            background-color: #1a232a;
            color: white;
            font-size: 1.1rem;
            outline: none;
        }

        .search-btn {
            background-color: #2ecc71;
            color: #10171d;
            border: none;
            padding: 0 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background-color: #27ae60;
        }

        /* Unique styling for the Full Screen button */
        .fullscreen-btn {
            background-color: #1a232a;
            color: #2ecc71;
            border: none;
            border-left: 1px solid #2ecc71;
            padding: 0 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .fullscreen-btn:hover {
            background-color: #2ecc71;
            color: #10171d;
        }

        .quick-links {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }

        .quick-links a {
            color: #95a5a6;
            text-decoration: none;
            padding: 10px 20px;
            background: #1a232a;
            border-radius: 8px;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .quick-links a:hover {
            color: #fff;
            border-color: #2ecc71;
            background: #212e37;
        }
    </style>
</head>
<body>

    <h1>Sigma_Trees</h1>
    <p>Fast, secure, and unrestricted web browsing.</p>

    <div class="search-container">
        <input type="text" id="uv-address" class="search-input" placeholder="Enter URL or search freely..." onkeydown="if(event.key === 'Enter') handleSearch()">
        <button class="search-btn" onclick="handleSearch()">Go</button>
        <button id="fullscreen-toggle" class="fullscreen-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
    </div>

    <div class="quick-links">
        <a href="#" onclick="launchProxy('https://youtube.com')">YouTube</a>
        <a href="#" onclick="launchProxy('https://discord.com')">Discord</a>
        <a href="#" onclick="launchProxy('https://google.com')">Google</a>
    </div>

    <script>
        function launchProxy(url) {
            if (!url) return;
            
            let targetUrl = url.trim();
            const urlPattern = /^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(:\d+)?(\/.*)?\$/;
            
            // Format input into a proper URL
            if (!/^https?:\/\//i.test(targetUrl)) {
                if (urlPattern.test(targetUrl)) {
                    targetUrl = 'https://' + targetUrl;
                } else {
                    // Fallback to Google Search if it's a plain keyword query
                    targetUrl = 'https://google.com' + encodeURIComponent(targetUrl);
                }
            }

            // Points directly to your running Node.js backend
            const backendProxyUrl = 'http://localhost:3000/proxy';

            // Redirect the user through your dynamic proxy backend
            window.location.href = `${backendProxyUrl}?url=${encodeURIComponent(targetUrl)}`;
        }

        function handleSearch() {
            const input = document.getElementById('uv-address');
            launchProxy(input.value);
        }

        // Handles switching between full window mode and normal view
        function toggleFullScreen() {
            const btn = document.getElementById('fullscreen-toggle');
            
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen()
                    .then(() => {
                        btn.innerText = "✕ Exit Full";
                    })
                    .catch((err) => {
                        console.error(`Error trying to enable fullscreen: ${err.message}`);
                    });
            } else {
                document.exitFullscreen();
                btn.innerText = "⛶ Fullscreen";
            }
        }

        // Keeps track of the text display if a user hits the 'Esc' key to quit full mode manually
        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('fullscreen-toggle');
            if (!document.fullscreenElement) {
                btn.innerText = "⛶ Fullscreen";
            }
        });
    </script>

</body>
</html>
